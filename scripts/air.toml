root = "."
tmp_dir = ".local/air"

[build]
cmd = "go build -o ./.local/air/cartquilt ./cmd/cartquilt"
entrypoint = ["./.local/air/cartquilt"]
include_dir = ["cmd", "internal"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
stop_on_error = false
delay = 250

[build.windows]
cmd = "go build -o ./.local/air/cartquilt.exe ./cmd/cartquilt"
entrypoint = ["./.local/air/cartquilt.exe"]

[misc]
clean_on_exit = true
startup_banner = ""
