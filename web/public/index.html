<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cartquilt</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/cartquilt-32.png" />
    <link rel="stylesheet" href="/editor.css" />
  </head>
  <body>
    <header>
      <img src="/cartquilt-64.png" srcset="/cartquilt-64.png 64w, /cartquilt-256.png 256w" sizes="48px" width="48" height="48" alt="" /><strong>Cartquilt</strong
      ><span class="slash">/</span><span id="project">Loading project…</span
      ><span
        class="local"
        title="Scene edits and world layout changes last in this tab until reload."
        >Local workspace</span
      >
    </header>
    <main>
      <aside id="navigator" aria-label="Navigator">
        <h2>Navigator</h2>
        <label class="filter"
          ><span aria-hidden="true">⌕</span
          ><input id="filter" type="search" aria-label="Filter scenes" placeholder="Filter scenes…"
        /></label>
        <div class="section"><span>Scenes</span><span id="count"></span></div>
        <div id="scenes"></div>
        <div id="objects"></div>
      </aside>
      <section id="workspace">
        <div id="toolbar">
          <div>
            <div id="crumb"></div>
            <h1 id="desk-title"></h1>
          </div>
          <div id="actions"></div>
        </div>
        <div id="panels">
          <button data-panel="navigator">Navigator</button
          ><button data-panel="inspector">Inspector</button>
        </div>
        <div id="canvas" tabindex="0" aria-label="World map canvas"><div id="plane"></div></div>
        <div id="hints"></div>
      </section>
      <aside id="inspector" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="details"></div>
      </aside>
    </main>
    <footer>
      <span id="location"></span><span id="status" role="status" aria-live="polite"></span>
    </footer>
    <script type="module" src="/js/editor.js"></script>
  </body>
</html>
