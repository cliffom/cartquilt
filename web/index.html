<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cartquilt</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/cartquilt-32.png" />
  </head>
  <body>
    <header>
      <img src="/cartquilt-64.png" srcset="/cartquilt-64.png 64w, /cartquilt-256.png 256w" sizes="48px" width="48" height="48" alt="" /><strong>Cartquilt</strong
      ><span class="slash" id="project-divider" hidden>/</span><span id="project" hidden></span>
      <div class="header-tools">
        <span id="service-status" class="service-status" role="status" title="Checking service">
          <span class="visually-hidden">Checking service</span>
        </span>
        <details id="project-menu" class="project-menu" hidden>
          <summary title="Project menu">
            <span class="hamburger-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Project menu</span>
          </summary>
          <div class="project-menu-panel">
            <button id="new-project" type="button">New project</button>
            <button id="open-project" type="button">Open project</button>
            <button id="close-project" type="button">Close project</button>
          </div>
        </details>
      </div>
    </header>
    <dialog id="new-project-dialog" aria-labelledby="new-project-title">
      <form id="new-project-form">
        <h2 id="new-project-title">New project</h2>
        <div id="project-name-field">
          <label for="project-name">Project name</label>
          <input id="project-name" required />
        </div>
        <label for="project-path">Project folder</label>
        <div class="folder-path-row">
          <input id="project-path" required aria-describedby="project-path-help" spellcheck="false" />
          <button id="browse-project-folders" type="button">Browse…</button>
        </div>
        <small id="project-path-help">Choose a parent folder or enter the full path to a new project folder.</small>
        <div id="create-project-result" role="status"></div>
        <div class="dialog-actions">
          <button id="close-project-dialog" type="button">Close</button>
          <button id="create-project" class="primary" type="submit">Create project</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-project-close" aria-labelledby="confirm-close-title" aria-describedby="confirm-close-message">
      <form method="dialog">
        <h2 id="confirm-close-title">Close project?</h2>
        <p id="confirm-close-message"></p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>Cancel</button>
          <button value="close" class="primary">Close project</button>
        </div>
      </form>
    </dialog>
    <dialog id="new-scene-dialog" aria-labelledby="new-scene-title">
      <form id="new-scene-form">
        <h2 id="new-scene-title">New scene</h2>
        <label for="scene-name">Scene name</label>
        <input id="scene-name" required />
        <div class="scene-dimensions">
          <label for="scene-width">Width in tiles<input id="scene-width" required type="number" /></label>
          <label for="scene-height">Height in tiles<input id="scene-height" required type="number" /></label>
        </div>
        <div id="new-scene-status" role="status"></div>
        <div class="dialog-actions">
          <button id="cancel-new-scene" type="button">Cancel</button>
          <button id="refresh-scene-list" type="button" hidden>Refresh scene list</button>
          <button id="create-scene" class="primary" type="submit">Create scene</button>
        </div>
      </form>
    </dialog>
    <div id="scene-context-menu" class="scene-menu" role="menu" hidden>
      <div class="scene-color-chips" role="group" aria-label="Border color">
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="" aria-checked="false" aria-label="Default border" title="Default border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#d47478" aria-checked="false" aria-label="Rose border" title="Rose border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#dc9a61" aria-checked="false" aria-label="Amber border" title="Amber border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#d9c569" aria-checked="false" aria-label="Gold border" title="Gold border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#a4bd64" aria-checked="false" aria-label="Moss border" title="Moss border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#67abc0" aria-checked="false" aria-label="Lake border" title="Lake border"></button>
        <button type="button" role="menuitemradio" tabindex="-1" data-scene-color="#ad91ce" aria-checked="false" aria-label="Violet border" title="Violet border"></button>
      </div>
      <button type="button" role="menuitem" tabindex="-1" value="rename">Rename…</button>
      <button type="button" role="menuitem" tabindex="-1" value="duplicate">Duplicate</button>
      <button id="world-card-connections" type="button" role="menuitem" tabindex="-1" hidden>Connections…</button>
      <button type="button" role="menuitem" tabindex="-1" value="delete" class="scene-delete-menu">Delete…</button>
    </div>
    <div id="connection-menu" class="scene-menu" role="menu" aria-label="Scene connection actions" hidden>
      <button id="add-entrance-here" type="button" role="menuitem" tabindex="-1"><span aria-hidden="true">+</span> Entrance</button>
      <button id="add-exit-here" type="button" role="menuitem" tabindex="-1"><span aria-hidden="true">+</span> Exit</button>
      <div id="connection-removals" role="group" aria-label="Remove connections" hidden></div>
    </div>
    <dialog id="scene-action-dialog" aria-labelledby="scene-action-title" aria-describedby="scene-action-description">
      <form id="scene-action-form">
        <h2 id="scene-action-title"></h2>
        <p id="scene-action-description" hidden></p>
        <div id="scene-action-name-field">
          <label for="scene-action-name">Scene name</label>
          <input id="scene-action-name" />
        </div>
        <div id="scene-action-message" role="status"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-scene-action">Cancel</button>
          <button type="submit" id="apply-scene-action" class="primary">Save</button>
        </div>
      </form>
    </dialog>
    <dialog id="connection-dialog" aria-labelledby="connection-title">
      <form id="connection-form" autocomplete="off">
        <h2 id="connection-title"></h2>
        <label for="connection-name">Name</label>
        <input id="connection-name" autocomplete="off" data-1p-ignore required />
        <div class="scene-dimensions">
          <label for="connection-x">Tile X<input id="connection-x" type="number" min="0" required /></label>
          <label for="connection-y">Tile Y<input id="connection-y" type="number" min="0" required /></label>
        </div>
        <div id="connection-exit-fields" hidden>
          <div class="scene-dimensions">
            <label for="connection-width">Width in tiles<input id="connection-width" type="number" min="1" required /></label>
            <label for="connection-height">Height in tiles<input id="connection-height" type="number" min="1" required /></label>
          </div>
          <label for="destination-scene">Destination scene</label>
          <span class="select-field"><select id="destination-scene" required></select></span>
          <label for="destination-entrance">Destination entrance</label>
          <span class="select-field"><select id="destination-entrance" required></select></span>
        </div>
        <div id="connection-status" role="status"></div>
        <div class="dialog-actions">
          <button id="remove-connection" type="button" hidden>Remove</button>
          <button id="cancel-connection" type="button">Cancel</button>
          <button id="save-connection" class="primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>
    <main id="project-launcher" hidden>
      <section class="launcher-card" aria-labelledby="launcher-title">
        <h1 id="launcher-title">Projects</h1>
        <div class="launcher-actions" id="launcher-actions">
          <button id="start-new-project" class="primary" type="button">New project</button>
          <button id="start-open-project" type="button">Open project</button>
        </div>
        <p id="launcher-status" role="status" hidden></p>
        <section id="recent-projects" aria-labelledby="recent-projects-title" hidden>
          <h2 id="recent-projects-title">Recent projects</h2>
          <ul id="recent-project-list"></ul>
        </section>
      </section>
    </main>
    <main id="editor-desk" hidden>
      <aside id="navigator" aria-label="Navigator">
        <h2>Navigator</h2>
        <div class="section scene-section">
          <button id="toggle-scenes" class="scene-section-label" type="button" aria-expanded="true" aria-controls="scene-list-group">
            <span class="scene-disclosure-icon" aria-hidden="true"></span>
            Scenes <span id="count" aria-hidden="true"></span>
          </button>
          <div class="scene-section-actions">
            <button id="add-scene" type="button" aria-label="New scene" title="New scene" aria-haspopup="dialog">
              <span aria-hidden="true">+</span>
            </button>
            <button id="search-scenes" type="button" aria-label="Search scenes" title="Search scenes" aria-expanded="false" aria-controls="filter">
              <span class="scene-search-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div id="scene-list-group">
          <input id="filter" class="scene-filter" type="search" aria-label="Filter scenes" placeholder="Filter scenes…" hidden />
          <div id="scenes"></div>
        </div>
        <div id="objects"></div>
      </aside>
      <section id="workspace">
        <div id="toolbar">
          <div>
            <div id="crumb"></div>
            <h1 id="desk-title"></h1>
          </div>
          <div id="actions" role="group" aria-label="Zoom controls">
            <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
            <span id="percentage">100%</span>
            <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="fit-view" class="scene-icon-button" type="button" aria-label="Fit view" title="Fit view">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 2.5H2.5V7m10.5-4.5h4.5V7m0 6v4.5H13m-6 0H2.5V13M7 7h6v6H7z" /></svg>
            </button>
          </div>
          <div id="scene-toolbar" class="scene-toolbar" role="group" aria-label="Scene tools" hidden>
            <div class="scene-tool-group" role="group" aria-label="Placement">
              <button id="place-entrance" type="button" aria-pressed="false"><span aria-hidden="true">+</span> Entrance</button>
              <button id="place-exit" type="button" aria-pressed="false"><span aria-hidden="true">+</span> Exit</button>
              <button id="toggle-blockout" type="button" aria-expanded="false" aria-controls="blockout-tools">Blockout</button>
            </div>
            <div class="scene-tool-group" role="group" aria-label="History">
              <button id="undo-scene" class="scene-icon-button" type="button" aria-label="Undo" title="Undo" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4-4 4 4 4M3 8h9a4 4 0 0 1 0 8h-2" /></svg>
              </button>
              <button id="redo-scene" class="scene-icon-button" type="button" aria-label="Redo" title="Redo" disabled>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m13 4 4 4-4 4m4-4H8a4 4 0 0 0 0 8h2" /></svg>
              </button>
            </div>
          </div>
        </div>
        <section id="blockout-tools" aria-label="Blockout tools" hidden>
          <div class="blockout-primary">
            <label class="blockout-inline-field blockout-brush-field">Brush <span class="select-field"><span id="blockout-brush-swatch" class="blockout-brush-swatch" aria-hidden="true" hidden></span><select id="blockout-brush"></select></span></label>
            <label id="blockout-label-field" class="blockout-inline-field" hidden>Label <input id="blockout-label" autocomplete="off" data-1p-ignore /></label>
            <div id="blockout-selection" hidden>
              <span id="blockout-selection-info"></span>
              <button id="apply-blockout-selection" type="button">Apply to selection</button>
            </div>
          </div>
          <div class="blockout-secondary">
            <label class="blockout-visibility"><input id="show-blockout" type="checkbox" checked /> Show layer</label>
            <details id="blockout-coordinates" name="blockout-details">
              <summary>Setup</summary>
              <div class="blockout-popover">
                <label class="blockout-inline-field">Movement <span class="select-field"><select id="blockout-profile" aria-disabled="false"></select></span></label>
                <form id="blockout-coordinate-form" aria-labelledby="blockout-coordinate-title">
                  <h3 id="blockout-coordinate-title">Tile coordinates</h3>
                  <div class="blockout-coordinate-fields">
                    <label>Tile X <input id="blockout-x" type="number" min="0" value="0" required /></label>
                    <label>Tile Y <input id="blockout-y" type="number" min="0" value="0" required /></label>
                    <label>Width in tiles <input id="blockout-width" type="number" min="1" value="1" required /></label>
                    <label>Height in tiles <input id="blockout-height" type="number" min="1" value="1" required /></label>
                  </div>
                  <button id="apply-blockout-coordinates" type="submit">Apply brush</button>
                </form>
              </div>
            </details>
            <details id="blockout-elements" name="blockout-details">
              <summary>Markers and guides</summary>
              <div class="blockout-popover"><ul id="blockout-element-list"></ul></div>
            </details>
          </div>
        </section>
        <div id="panels">
          <button data-panel="navigator">Navigator</button
          ><button data-panel="inspector">Inspector</button>
        </div>
        <div id="canvas" tabindex="0" aria-label="World map canvas"><div id="plane"></div></div>
        <div id="workspace-feedback">
          <div id="hints" role="status"></div>
          <span id="blockout-status" role="status" hidden></span>
          <span id="blockout-save-error" role="alert" hidden></span>
        </div>
      </section>
      <aside id="inspector" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="details"></div>
      </aside>
    </main>
    <footer id="editor-footer" hidden>
      <span id="location"></span>
      <div class="editor-status-tools">
        <span id="status" role="status" aria-live="polite"></span>
        <button type="button" id="retry-layout-save" hidden>Retry layout save</button>
      </div>
    </footer>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
