<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cartquilt</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/cartquilt-32.png" />
  </head>
  <body>
    <header>
      <img src="/cartquilt-64.png" srcset="/cartquilt-64.png 64w, /cartquilt-256.png 256w" sizes="48px" width="48" height="48" alt="" /><strong>Cartquilt</strong
      ><span class="slash" id="project-divider" hidden>/</span><span id="project" hidden></span>
      <div class="header-tools">
        <span id="service-status" class="service-status" role="status" title="Checking service">
          <span class="visually-hidden">Checking service</span>
        </span>
        <details id="project-menu" class="project-menu" hidden>
          <summary title="Project menu">
            <span class="hamburger-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Project menu</span>
          </summary>
          <div class="project-menu-panel">
            <button id="new-project" type="button">New project</button>
            <button id="open-project" type="button">Open project</button>
            <button id="close-project" type="button">Close project</button>
          </div>
        </details>
      </div>
    </header>
    <dialog id="new-project-dialog" aria-labelledby="new-project-title">
      <form id="new-project-form">
        <h2 id="new-project-title">New project</h2>
        <div id="project-name-field">
          <label for="project-name">Project name</label>
          <input id="project-name" required />
        </div>
        <label for="project-path">Project folder</label>
        <div class="folder-path-row">
          <input id="project-path" required aria-describedby="project-path-help" spellcheck="false" />
          <button id="browse-project-folders" type="button">Browse…</button>
        </div>
        <small id="project-path-help">Choose a parent folder or enter the full path to a new project folder.</small>
        <div id="create-project-result" role="status"></div>
        <div class="dialog-actions">
          <button id="close-project-dialog" type="button">Close</button>
          <button id="create-project" class="primary" type="submit">Create project</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-project-close" aria-labelledby="confirm-close-title" aria-describedby="confirm-close-message">
      <form method="dialog">
        <h2 id="confirm-close-title">Close project?</h2>
        <p id="confirm-close-message"></p>
        <div class="dialog-actions">
          <button value="cancel" autofocus>Cancel</button>
          <button value="close" class="primary">Close project</button>
        </div>
      </form>
    </dialog>
    <dialog id="new-scene-dialog" aria-labelledby="new-scene-title">
      <form id="new-scene-form">
        <h2 id="new-scene-title">New scene</h2>
        <label for="scene-name">Scene name</label>
        <input id="scene-name" required />
        <div class="scene-dimensions">
          <label for="scene-width">Width in tiles<input id="scene-width" required type="number" min="1" max="1024" value="20" /></label>
          <label for="scene-height">Height in tiles<input id="scene-height" required type="number" min="1" max="1024" value="18" /></label>
        </div>
        <div id="new-scene-status" role="status"></div>
        <div class="dialog-actions">
          <button id="cancel-new-scene" type="button">Cancel</button>
          <button id="refresh-scene-list" type="button" hidden>Refresh scene list</button>
          <button id="create-scene" class="primary" type="submit">Create scene</button>
        </div>
      </form>
    </dialog>
    <main id="project-launcher" hidden>
      <section class="launcher-card" aria-labelledby="launcher-title">
        <h1 id="launcher-title">Projects</h1>
        <div class="launcher-actions" id="launcher-actions">
          <button id="start-new-project" class="primary" type="button">New project</button>
          <button id="start-open-project" type="button">Open project</button>
        </div>
        <p id="launcher-status" role="status" hidden></p>
        <section id="recent-projects" aria-labelledby="recent-projects-title" hidden>
          <h2 id="recent-projects-title">Recent projects</h2>
          <ul id="recent-project-list"></ul>
        </section>
      </section>
    </main>
    <main id="editor-desk" hidden>
      <aside id="navigator" aria-label="Navigator">
        <h2>Navigator</h2>
        <div class="section scene-section">
          <button id="toggle-scenes" class="scene-section-label" type="button" aria-expanded="true" aria-controls="scene-list-group">
            <span class="scene-disclosure-icon" aria-hidden="true"></span>
            Scenes <span id="count" aria-hidden="true"></span>
          </button>
          <div class="scene-section-actions">
            <button id="add-scene" type="button" aria-label="New scene" title="New scene" aria-haspopup="dialog">
              <span aria-hidden="true">+</span>
            </button>
            <button id="search-scenes" type="button" aria-label="Search scenes" title="Search scenes" aria-expanded="false" aria-controls="filter">
              <span class="scene-search-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div id="scene-list-group">
          <input id="filter" class="scene-filter" type="search" aria-label="Filter scenes" placeholder="Filter scenes…" hidden />
          <div id="scenes"></div>
        </div>
        <div id="objects"></div>
      </aside>
      <section id="workspace">
        <div id="toolbar">
          <div>
            <div id="crumb"></div>
            <h1 id="desk-title"></h1>
          </div>
          <div id="actions"></div>
        </div>
        <div id="panels">
          <button data-panel="navigator">Navigator</button
          ><button data-panel="inspector">Inspector</button>
        </div>
        <div id="canvas" tabindex="0" aria-label="World map canvas"><div id="plane"></div></div>
        <div id="hints"></div>
      </section>
      <aside id="inspector" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="details"></div>
      </aside>
    </main>
    <footer id="editor-footer" hidden>
      <span id="location"></span><span id="status" role="status" aria-live="polite"></span>
    </footer>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
